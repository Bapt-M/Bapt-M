# Test temporaire : le code Cloudflare lit-il la page brute ?
name: Debug page brute
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSL -A "Mozilla/5.0" -o /tmp/page.html \
            "https://forms.registration4all.com/EventRegistration/Register_Sport_Event.aspx?EventID=233725&RORG=LSCAL"
          cp cloudflare-bot/src/index.js /tmp/bot.mjs
          node -e '
            import("/tmp/bot.mjs").then(m => {
              const html = require("fs").readFileSync("/tmp/page.html","utf8");
              console.log(JSON.stringify(m.findRemaining(html)));
            });'
