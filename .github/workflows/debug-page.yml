# Test temporaire : structure brute de la page
name: Debug page brute
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -A "Mozilla/5.0" -o /tmp/page.html \
            "https://forms.registration4all.com/EventRegistration/Register_Sport_Event.aspx?EventID=233725&RORG=LSCAL"
          python3 - <<'PY'
          import re
          s=open('/tmp/page.html',encoding='utf-8',errors='replace').read()
          i=s.find('Le Trail des Crêtes 65km en DUO')
          seg=re.sub(r'\s+',' ',s[i:i+12000])
          j=seg.lower().find('inscrire')
          print(seg[:j+300])
          print('=== ids _6 ===')
          for m in re.finditer(r'id="([^"]*_6)"[^>]*>([^<]{0,80})', s):
              print(m.group(1), '=>', m.group(2).strip())
          PY
